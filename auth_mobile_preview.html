<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e12" />
  <title>FocusUp — Sign In (Mobile Preview)</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e12;
      --bg2: #16161d;
      --bg3: #1e1e28;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #f0f0f5;
      --text2: #9090a8;
      --text3: #5a5a72;
      --accent: #7c6dfa;
      --accent2: #a695ff;
      --accent-bg: rgba(124,109,250,0.12);
      --green: #22d37a;
      --green-bg: rgba(34,211,122,0.1);
      --amber: #f5a623;
      --amber-bg: rgba(245,166,35,0.1);
      --red: #ff5c6e;
      --red-bg: rgba(255,92,110,0.1);
      --sidebar-w: 220px;
      --radius: 14px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      font-size: 16px;
      background: var(--bg);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      transition: background 0.3s, color 0.3s;
    }

    a {
      color: inherit;
    }

    .auth-wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-card {
      background: var(--bg2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 3rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      margin-bottom: 3rem;
    }

    .auth-logo-image {
      display: block;
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 18px;
    }

    .auth-title {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.6px;
      line-height: 1.2;
    }

    .auth-sub {
      font-size: 15px;
      color: var(--text2);
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .auth-tab {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .auth-tab:hover {
      color: var(--text);
    }

    .auth-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .auth-field {
      margin-bottom: 2rem;
    }

    .auth-field label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .auth-field input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      line-height: 1.5;
    }

    .auth-field input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .auth-field input:hover {
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.25);
    }

    .auth-field input:focus {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.2);
      box-shadow: 0 0 0 3px rgba(124, 109, 250, 0.1);
    }

    .auth-submit {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1.5rem;
      letter-spacing: 0.3px;
    }

    .auth-submit:hover {
      background: var(--accent2);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(124, 109, 250, 0.3);
    }

    .auth-submit:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(124, 109, 250, 0.2);
    }

    @media (max-width: 640px) {
      .auth-wrap {
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
        min-height: 100dvh;
      }

      .auth-card {
        padding: 2.5rem 1.5rem;
        border-radius: 20px;
        max-width: 100%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      }

      .auth-logo {
        margin-bottom: 2.5rem;
      }

      .auth-logo-icon {
        width: 42px;
        height: 42px;
        font-size: 22px;
      }

      .auth-logo span {
        font-size: 18px;
      }

      .auth-title {
        font-size: 28px;
        margin-bottom: 10px;
        line-height: 1.25;
      }

      .auth-sub {
        font-size: 15px;
        margin-bottom: 2rem;
      }

      .auth-tabs {
        margin-bottom: 2rem;
      }

      .auth-tab {
        font-size: 15px;
        padding: 14px 0;
      }

      .auth-field {
        margin-bottom: 1.75rem;
      }

      .auth-field label {
        font-size: 12px;
        margin-bottom: 8px;
      }

      .auth-field input {
        padding: 14px 16px;
        font-size: 16px;
        border-radius: 12px;
        min-height: 50px;
      }

      .auth-submit {
        padding: 14px 16px;
        font-size: 16px;
        margin-top: 1.5rem;
        min-height: 50px;
        font-weight: 600;
      }
    }

    @media (max-width: 380px) {
      .auth-card {
        padding: 2rem 1.25rem;
      }

      .auth-title {
        font-size: 26px;
      }

      .auth-tabs {
        margin-bottom: 1.75rem;
      }

      .auth-field {
        margin-bottom: 1.5rem;
      }

      .auth-submit {
        margin-top: 1.25rem;
      }
    }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo-image" src="1.png" alt="FocusUp" />
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to sync your XP everywhere</p>
    <div class="auth-tabs">
      <button class="auth-tab active">Sign in</button>
      <button class="auth-tab">Sign up</button>
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" placeholder="you@email.com" />
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" placeholder="••••••••" />
    </div>
    <button class="auth-submit">Sign in</button>
    <div style="margin-top: 2rem; text-align: center; font-size: 12px; color: var(--text3);">
      © 2026 FocusUp. All rights reserved.
    </div>
  </div>
</div>
</body>
</html>
