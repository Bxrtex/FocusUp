<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e12" />
  <title>FocusUp — Sign In</title>
  <link rel="stylesheet" href="style.css?v=20260510a" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-card {
      background: var(--bg2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 3rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      margin-bottom: 3rem;
    }

    .auth-logo-image {
      display: block;
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 18px;
    }

    .auth-title {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.6px;
      line-height: 1.2;
    }

    .auth-sub {
      font-size: 15px;
      color: var(--text2);
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .auth-tab {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .auth-tab:hover {
      color: var(--text);
    }

    .auth-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .auth-field {
      margin-bottom: 2rem;
    }

    .auth-field label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .auth-field input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      line-height: 1.5;
    }

    .auth-field input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .auth-field input:hover {
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.25);
    }

    .auth-field input:focus {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.2);
      box-shadow: 0 0 0 3px rgba(124, 109, 250, 0.1);
    }

    .auth-submit {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1.5rem;
      letter-spacing: 0.3px;
    }

    .auth-submit:hover {
      background: var(--accent2);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(124, 109, 250, 0.3);
    }

    .auth-submit:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(124, 109, 250, 0.2);
    }

    .auth-demo {
      margin-top: 12px;
      width: 100%;
      padding: 13px 16px;
      border: 1px solid rgba(124, 109, 250, 0.55);
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .auth-demo:hover {
      background: rgba(124, 109, 250, 0.12);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .auth-demo-note {
      margin: 10px 0 0;
      color: var(--text3);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .auth-error {
      background: rgba(255, 92, 110, 0.1);
      color: var(--red);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 1.5rem;
      display: none;
      border: 1px solid rgba(255, 92, 110, 0.2);
      line-height: 1.5;
    }

    .auth-error.show { display: block; }

    .auth-success {
      background: rgba(34, 211, 122, 0.1);
      color: var(--green);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 1.5rem;
      display: none;
      border: 1px solid rgba(34, 211, 122, 0.2);
      line-height: 1.5;
    }

    .auth-success.show { display: block; }

    .loading { opacity: 0.6; pointer-events: none; }

    .auth-meta {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      text-align: center;
    }

    .auth-meta span {
      font-size: 13px;
      color: var(--text3);
      line-height: 1.5;
    }

    .auth-legal-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .auth-legal-link {
      color: var(--text2);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s ease;
      font-weight: 500;
    }

    .auth-legal-link:hover {
      color: var(--accent2);
    }

    @media (max-width: 640px) {
      .auth-wrap {
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
        min-height: 100dvh;
      }

      .auth-card {
        padding: 2.5rem 1.5rem;
        border-radius: 20px;
        max-width: 100%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      }

      .auth-logo {
        margin-bottom: 2.5rem;
      }

      .auth-logo-icon {
        width: 42px;
        height: 42px;
        font-size: 22px;
      }

      .auth-logo span {
        font-size: 18px;
      }

      .auth-title {
        font-size: 28px;
        margin-bottom: 10px;
        line-height: 1.25;
      }

      .auth-sub {
        font-size: 15px;
        margin-bottom: 2rem;
      }

      .auth-tabs {
        margin-bottom: 2rem;
      }

      .auth-tab {
        font-size: 15px;
        padding: 14px 0;
      }

      .auth-field {
        margin-bottom: 1.75rem;
      }

      .auth-field label {
        font-size: 12px;
        margin-bottom: 8px;
      }

      .auth-field input {
        padding: 14px 16px;
        font-size: 16px;
        border-radius: 12px;
        min-height: 50px;
      }

      .auth-submit {
        padding: 14px 16px;
        font-size: 16px;
        margin-top: 1.5rem;
        min-height: 50px;
        font-weight: 600;
      }

      .auth-meta {
        margin-top: 2rem;
      }

      .auth-legal-links {
        gap: 1rem;
      }

      .auth-legal-link {
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      .auth-card {
        padding: 2rem 1.25rem;
      }

      .auth-title {
        font-size: 26px;
      }

      .auth-tabs {
        margin-bottom: 1.75rem;
      }

      .auth-field {
        margin-bottom: 1.5rem;
      }

      .auth-submit {
        margin-top: 1.25rem;
      }
    }

    @media (max-height: 700px) and (max-width: 640px) {
      .auth-card {
        padding: 2rem 1.5rem;
      }

      .auth-logo {
        margin-bottom: 1.5rem;
      }

      .auth-title {
        font-size: 26px;
        margin-bottom: 8px;
      }

      .auth-sub {
        margin-bottom: 1.5rem;
      }

      .auth-tabs {
        margin-bottom: 1.5rem;
      }

      .auth-field {
        margin-bottom: 1.25rem;
      }

      .auth-field input {
        font-size: 16px;
      }

      .auth-submit {
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo-image" src="1.png" alt="FocusUp" />
    </div>

    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to sync your XP everywhere</div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Sign in</button>
      <button class="auth-tab" onclick="switchAuthTab('signup')">Sign up</button>
    </div>

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-success" id="auth-success"></div>

    <div id="form-login">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@email.com" />
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="auth-submit" onclick="handleLogin()">Sign in</button>
      <button class="auth-demo" type="button" onclick="startDemo()">Demo</button>
      <p class="auth-demo-note">Explore FocusUp with sample data — no account needed.</p>
    </div>

    <div id="form-signup" style="display:none">
      <div class="auth-field">
        <label>Username</label>
        <input type="text" id="signup-username" placeholder="cooluser123" />
      </div>
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@email.com" />
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="min 6 characters" />
      </div>
      <button class="auth-submit" onclick="handleSignup()">Create account</button>
    </div>

    <div class="auth-meta">
      <div class="auth-legal-links">
        <a class="auth-legal-link" href="terms.html">Terms of Service</a>
        <a class="auth-legal-link" href="privacy.html">Privacy Policy</a>
      </div>
      <span>© 2026 FocusUp. All rights reserved.</span>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  function getPageUrl(page) {
    return new URL(page, window.location.href).toString();
  }

  const initialAuthError = new URLSearchParams(window.location.search).get('auth_error');

  db.auth.getSession()
    .then(({ data: { session } }) => {
      if (session) window.location.href = getPageUrl('index.html');
      if (initialAuthError === 'connection') {
        showError('Cannot reach Supabase right now. Check that the project is unpaused and config.js has the current project URL and publishable key.');
        window.history.replaceState({}, '', getPageUrl('auth.html'));
      }
    })
    .catch(() => {
      showError('Cannot reach Supabase right now. Check that the project is unpaused and config.js has the current project URL and publishable key.');
    });

  function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', ['login','signup'][i] === tab));
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
    clearMessages();
  }

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('auth-success').classList.remove('show');
  }

  function showSuccess(msg) {
    const el = document.getElementById('auth-success');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('auth-error').classList.remove('show');
  }

  function clearMessages() {
    document.getElementById('auth-error').classList.remove('show');
    document.getElementById('auth-success').classList.remove('show');
  }

  function getFriendlyAuthError(error) {
    if (!error) return 'Something went wrong. Please try again.';
    const message = error.message || String(error);
    if (/failed to fetch|network|fetch/i.test(message)) {
      return 'Cannot reach Supabase right now. Check that the project is unpaused and config.js has the current project URL and publishable key.';
    }
    return message;
  }

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showError('Please fill in all fields');
    try {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return showError(getFriendlyAuthError(error));
      window.location.href = 'index.html';
    } catch (error) {
      showError(getFriendlyAuthError(error));
    }
  }

  function startDemo() {
    window.location.href = 'index.html?demo=1';
  }

  async function handleSignup() {
    const username = document.getElementById('signup-username').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    if (!username || !email || !password) return showError('Please fill in all fields');
    if (password.length < 6) return showError('Password must be at least 6 characters');
    try {
      const { error } = await db.auth.signUp({ email, password, options: { data: { username } } });
      if (error) return showError(getFriendlyAuthError(error));
      showSuccess('Account created! You can now sign in.');
    } catch (error) {
      showError(getFriendlyAuthError(error));
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const tab = document.getElementById('form-login').style.display !== 'none' ? 'login' : 'signup';
      tab === 'login' ? handleLogin() : handleSignup();
    }
  });
</script>
</body>
</html>
